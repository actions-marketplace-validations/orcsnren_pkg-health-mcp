name: Feature request
description: A new ecosystem, signal, tool or manifest format
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: data
    attributes:
      label: Data source
      description: For new signals or ecosystems, which public API would provide the data?
